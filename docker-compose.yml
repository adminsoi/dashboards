# SOI Aviation department dashboards — the Portainer stack.
#
# This does NOT run its own web server or get its own certificate. It joins
# the MCP stack's Docker network and the Caddy already running there proxies
# to it, exactly as the connectors are served. One front door, one set of
# certificates, one place to look when something breaks.
#
#   docker compose up --build -d
#
# Two prerequisites on the host, both one-offs Portainer cannot do for you:
#   1. The MCP stack is up, so its network exists. SOI_NETWORK must name that
#      network — check Portainer's Networks page, or `docker network ls | grep soi`.
#   2. The MCP stack's Caddyfile has a block routing dashboard.soiaviation.com
#      to dashboard:3000, and Caddy has been reloaded.
#
# See PORTAINER.md.

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    # Least-privilege: the root filesystem is read-only. The one writable
    # place is the task-store volume below.
    user: "node"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # RFQ task tracker data (tasks.json). Back this volume up — it is the
      # only state the dashboard keeps.
      - dashboard-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
    # No published port on purpose — Caddy terminates TLS and proxies in over
    # the shared network. Nothing here is reachable from outside it.
    expose:
      - "3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      # Must match the Entra redirect URI, which is this + /auth/callback.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://dashboard.soiaviation.com}

      # --- Entra SSO (required) ---
      AUTH_MODE: entra
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?set ENTRA_TENANT_ID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:?set ENTRA_CLIENT_ID}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:?set ENTRA_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET — at least 32 chars}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}

      # --- Department access control (optional) ---
      # Off by default: any signed-in SOI user can open any dashboard, and the
      # home page says so. Turn on once the Entra groups exist; it fails closed.
      DEPT_ACCESS_ENFORCE: ${DEPT_ACCESS_ENFORCE:-false}
      DEPT_GROUP_GOVERNMENT: ${DEPT_GROUP_GOVERNMENT:-}
      DEPT_GROUP_PROCUREMENT: ${DEPT_GROUP_PROCUREMENT:-}
      DEPT_GROUP_PURCHASING: ${DEPT_GROUP_PURCHASING:-}
      DEPT_GROUP_FINANCE: ${DEPT_GROUP_FINANCE:-}
      DEPT_GROUP_ADMINISTRATION: ${DEPT_GROUP_ADMINISTRATION:-}
      DEPT_GROUP_HR: ${DEPT_GROUP_HR:-}
      DEPT_GROUP_IT: ${DEPT_GROUP_IT:-}
      DEPT_GROUP_OPERATIONS: ${DEPT_GROUP_OPERATIONS:-}
      DEPT_GROUP_ALL: ${DEPT_GROUP_ALL:-}
      # Managers see every RFQ task and may assign tasks to others. Unset means
      # nobody is a manager: everyone sees only their own tasks.
      DEPT_GROUP_MANAGERS: ${DEPT_GROUP_MANAGERS:-}

      # --- Claude links (optional) ---
      # claude.ai project URL per department; only https://claude.ai links are kept.
      CLAUDE_CHAT_URL: ${CLAUDE_CHAT_URL:-https://claude.ai/new}
      CLAUDE_PROJECT_GOVERNMENT: ${CLAUDE_PROJECT_GOVERNMENT:-}
      CLAUDE_PROJECT_PROCUREMENT: ${CLAUDE_PROJECT_PROCUREMENT:-}
      CLAUDE_PROJECT_PURCHASING: ${CLAUDE_PROJECT_PURCHASING:-}
      CLAUDE_PROJECT_FINANCE: ${CLAUDE_PROJECT_FINANCE:-}
      CLAUDE_PROJECT_ADMINISTRATION: ${CLAUDE_PROJECT_ADMINISTRATION:-}
      CLAUDE_PROJECT_HR: ${CLAUDE_PROJECT_HR:-}
      CLAUDE_PROJECT_IT: ${CLAUDE_PROJECT_IT:-}
      CLAUDE_PROJECT_OPERATIONS: ${CLAUDE_PROJECT_OPERATIONS:-}

      # --- Data source (optional) ---
      # Empty means standalone: every data tile honestly reports that nothing
      # is connected, which is a supported configuration. Because this shares
      # the MCP stack's network, the backend is reachable at
      # http://backend:8080 — set BACKEND_BASE_URL to that (and the token) to
      # light the tiles up. Nothing else has to change.
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-}
      BACKEND_SERVICE_TOKEN: ${BACKEND_SERVICE_TOKEN:-}
      SERVICE_PROBES: ${SERVICE_PROBES:-}
      GOVERNMENT_NAICS: ${GOVERNMENT_NAICS:-336413}
    healthcheck:
      # Portainer shows this in its UI — the quickest way to tell a
      # crash-looping container from a misconfigured one. node:22-slim has no
      # curl, so use Node's own fetch.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      soi:
        # Caddy proxies to the name "dashboard", so pin the alias rather than
        # relying on the compose project name.
        aliases:
          - dashboard

volumes:
  dashboard-data:

networks:
  soi:
    external: true
    # Default network of the MCP stack (compose names it <project>_default).
    # Override with SOI_NETWORK if that stack is named something else.
    name: ${SOI_NETWORK:-soi-aviation-mcp_default}
