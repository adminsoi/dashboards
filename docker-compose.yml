# Standalone stack for the department dashboards.
#
# This runs on its own host — it does NOT share a Docker network with the MCP
# connector stack, because Docker networks are per-host and the two now live on
# different EC2 instances. It reaches the MCP stack's private backend over the
# VPC private network instead. See PORTAINER.md for the full deploy.
#
#   docker compose up --build -d                     # app only
#   docker compose --profile tls up --build -d        # app + its own HTTPS
#
# BACKEND_BASE_URL must point at the MCP host's PRIVATE IP, e.g.
# http://10.0.1.23:8080 — never its public IP, and never over the internet.
# That requires, on the MCP host, one security-group rule and the backend port
# published on its private interface. PORTAINER.md spells both out.
#
# Use the `tls` profile only if ports 80/443 are free on this host. If
# something already serves them, leave the profile off and point that server at
# 127.0.0.1:3000 instead.

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    # Least-privilege: nothing here writes to disk at runtime.
    user: "node"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
    # Bound to loopback by default so the app is never directly internet-facing
    # — TLS terminates in front of it, either the caddy service below or a web
    # server already on this host. Override DASHBOARD_BIND only deliberately.
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1:3000}:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://dashboard.soiaviation.com}

      # The MCP stack's private backend, over the VPC. Holds every downstream
      # API credential; this container holds none of them.
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:?set BACKEND_BASE_URL to the MCP host private IP, e.g. http://10.0.1.23:8080}
      BACKEND_SERVICE_TOKEN: ${BACKEND_SERVICE_TOKEN:?set BACKEND_SERVICE_TOKEN — the value from the MCP host .env}
      BACKEND_TIMEOUT_MS: ${BACKEND_TIMEOUT_MS:-15000}

      # Entra SSO. This app needs its OWN app registration — not the MCP ones.
      AUTH_MODE: entra
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?set ENTRA_TENANT_ID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:?set ENTRA_CLIENT_ID}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:?set ENTRA_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET — at least 32 chars}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}

      # Department access control. Leave enforcement off until every group id
      # below is real; it fails closed, so a half-filled directory locks people
      # out rather than letting them in.
      DEPT_ACCESS_ENFORCE: ${DEPT_ACCESS_ENFORCE:-false}
      DEPT_GROUP_GOVERNMENT: ${DEPT_GROUP_GOVERNMENT:-}
      DEPT_GROUP_PROCUREMENT: ${DEPT_GROUP_PROCUREMENT:-}
      DEPT_GROUP_PURCHASING: ${DEPT_GROUP_PURCHASING:-}
      DEPT_GROUP_FINANCE: ${DEPT_GROUP_FINANCE:-}
      DEPT_GROUP_HR: ${DEPT_GROUP_HR:-}
      DEPT_GROUP_IT: ${DEPT_GROUP_IT:-}
      DEPT_GROUP_OPERATIONS: ${DEPT_GROUP_OPERATIONS:-}
      DEPT_GROUP_ALL: ${DEPT_GROUP_ALL:-}

      # NAICS code driving the Government feed (336413 = aircraft parts).
      GOVERNMENT_NAICS: ${GOVERNMENT_NAICS:-336413}

      # The IT dashboard probes the fleet. The connector containers live on the
      # other host, so by default probe only what this host can actually see.
      # To include the connectors, publish their health ports and list them as
      # "Label=host:port,..." — see PORTAINER.md.
      SERVICE_PROBES: ${SERVICE_PROBES:-}
    healthcheck:
      # Portainer shows this in its UI, and it distinguishes a crash-looping
      # container from a misconfigured one. node:22-slim has no curl, so use
      # Node's own fetch.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --- Optional HTTPS front door --------------------------------------------
  # Only starts with `--profile tls`. Skip it if this host already serves
  # 80/443; point that server at 127.0.0.1:3000 instead.
  caddy:
    image: caddy:2
    profiles:
      - tls
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard

volumes:
  caddy_data:
  caddy_config:
