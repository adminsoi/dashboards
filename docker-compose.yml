# SOI Aviation department dashboards — standalone stack.
#
# Self-contained: Entra SSO and the dashboard UI, nothing else. No connection
# to any other SOI system is required to run this.
#
#   docker compose up --build -d                  # app only
#   docker compose --profile tls up --build -d     # app + its own HTTPS
#
# Use the `tls` profile only if ports 80/443 are free on this host. If a web
# server already serves them, leave the profile off and point it at
# 127.0.0.1:3000.
#
# Four variables are required: the three Entra values and SESSION_SECRET.
# Everything else has a working default. The `tls` profile additionally needs
# GODADDY_API_TOKEN, since it gets its certificate over DNS-01 rather than by
# being reachable from the internet.

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    # Least-privilege: nothing here writes to disk at runtime.
    user: "node"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
    # Loopback by default so the app is never directly internet-facing — TLS
    # terminates in front of it. Override only deliberately.
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1:3000}:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      # Must match the Entra redirect URI, which is this + /auth/callback.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://dashboard.soiaviation.com}

      # --- Entra SSO (required) ---
      AUTH_MODE: entra
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?set ENTRA_TENANT_ID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:?set ENTRA_CLIENT_ID}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:?set ENTRA_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET — at least 32 chars}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}

      # --- Department access control (optional) ---
      # Off by default: any signed-in SOI user can open any dashboard, and the
      # home page says so. Turn on once the Entra groups exist; it fails closed.
      DEPT_ACCESS_ENFORCE: ${DEPT_ACCESS_ENFORCE:-false}
      DEPT_GROUP_GOVERNMENT: ${DEPT_GROUP_GOVERNMENT:-}
      DEPT_GROUP_PROCUREMENT: ${DEPT_GROUP_PROCUREMENT:-}
      DEPT_GROUP_PURCHASING: ${DEPT_GROUP_PURCHASING:-}
      DEPT_GROUP_FINANCE: ${DEPT_GROUP_FINANCE:-}
      DEPT_GROUP_HR: ${DEPT_GROUP_HR:-}
      DEPT_GROUP_IT: ${DEPT_GROUP_IT:-}
      DEPT_GROUP_OPERATIONS: ${DEPT_GROUP_OPERATIONS:-}
      DEPT_GROUP_ALL: ${DEPT_GROUP_ALL:-}

      # --- Data source (optional, off by default) ---
      # Unset means standalone: every data tile honestly reports that nothing
      # is connected. Set it later to light those tiles up; nothing else has
      # to change.
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-}
      BACKEND_SERVICE_TOKEN: ${BACKEND_SERVICE_TOKEN:-}
      SERVICE_PROBES: ${SERVICE_PROBES:-}
      GOVERNMENT_NAICS: ${GOVERNMENT_NAICS:-336413}
    healthcheck:
      # Portainer shows this in its UI — the quickest way to tell a
      # crash-looping container from a misconfigured one. node:22-slim has no
      # curl, so use Node's own fetch.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --- Optional HTTPS front door --------------------------------------------
  # Starts only with `--profile tls`. Entra will not accept a plain-http
  # redirect URI for a real hostname, so this app needs HTTPS one way or
  # another: either this, or a web server already on 80/443 here.
  caddy:
    # Built, not pulled: the stock image can only prove domain ownership over
    # HTTP, and this host has no public IP. ./caddy/Dockerfile compiles in the
    # DNS-01 provider plugins. See the Caddyfile.
    build:
      context: ./caddy
    profiles:
      - tls
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The hostname Caddy serves and gets a certificate for. Keep this and
      # PUBLIC_BASE_URL in agreement — Entra matches the redirect URI exactly.
      DASHBOARD_HOST: ${DASHBOARD_HOST:-dashboard.soiaviation.com}
      # "key:secret" from a GoDaddy Production API key. Plain `:-` and not
      # `:?`: Compose interpolates the whole file whatever the active profile,
      # so a required-marker here would break deploys that don't use TLS.
      GODADDY_API_TOKEN: ${GODADDY_API_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard

volumes:
  caddy_data:
  caddy_config:
